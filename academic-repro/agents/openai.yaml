interface:
  display_name: "Academic Repro"
  short_description: "复现或评估论文中的计算图表与定量结果，并明确科学证据边界"
  default_prompt: "Use $academic-repro to assess or reproduce this paper target. Prefer usable target-relevant author source in its native runtime, treat reported values as tests rather than tuning goals, and keep delivery concise. If an indispensable non-regenerable input is unavailable after a bounded authoritative check, stop the exact route before fallback construction and provide only the requested concise blocked note."
